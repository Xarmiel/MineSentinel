# ==============================================================================
#                      CONFIGURACIÓN PRINCIPAL DE MINESENTINEL
# ==============================================================================
server.port=${PORT:8080}
# Sesión solo por cookie: sin esto Tomcat redirige a "/;jsessionid=..." en el primer login y da 404.
server.servlet.session.tracking-modes=cookie
# Railway termina HTTPS en su proxy: respetar X-Forwarded-Proto para que las redirecciones sean https.
server.forward-headers-strategy=framework
# El MJPEG de /camara es una respuesta asíncrona infinita: con el plazo por
# defecto (30 s) se corta y el navegador queda con la imagen congelada. Los
# SseEmitter no se ven afectados porque declaran su propio timeout.
spring.mvc.async.request-timeout=-1
spring.application.name=mine-sentinel-backend
spring.thymeleaf.cache=false

# ==============================================================================
#          CONFIGURACIÓN DE CONEXIÓN POSTGRESQL (SUPABASE)
# ==============================================================================
# NOTA: el host directo (db.<ref>.supabase.co) publica SOLO un registro DNS AAAA
# (IPv6). En equipos sin IPv6 es inalcanzable, por eso el valor por defecto es el
# CONNECTION POOLER, que resuelve a IPv4. El pooler exige que el usuario incluya
# el ref del proyecto: postgres.<ref>, no postgres.
# Estos valores pueden sobreescribirse con las variables DB_HOST, DB_PORT,
# DB_NAME, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-us-east-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME:postgres.dbimdevutkrsajxgseyu}
spring.datasource.password=${DB_PASSWORD:Ramiropt12345%}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
#                CONFIGURACIÓN DEL POOL DE CONEXIONES (HIKARICP)
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.pool-name=MineSentinelHikariPool

# ==============================================================================
#                   CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ==============================================================================
#                 PARÁMETROS DE OPERACIÓN MINERA (AFORO Y ALARMAS)
# ==============================================================================
minesentinel.aforo.maximo=50
minesentinel.aforo.minimo=10
minesentinel.aforo.umbral-critico=90
minesentinel.browser.auto-launch=${BROWSER_AUTO_LAUNCH:true}

# ==============================================================================
#            VENTANA DE VIGENCIA DEL CANAL DE VISIÓN (YOLOv8)
# ==============================================================================
# Segundos que un cuadro y un frame se consideran "actuales". Pasado este plazo
# sin que el motor publique, /camara muestra "sin señal" en vez de una imagen
# congelada de hace un minuto. Debe ser MAYOR que el intervalo real de
# publicación del motor (epp_config.yaml -> cuadro.intervalo_fotogramas):
# con 3 modelos sobre CPU la inferencia puede bajar de 0.25 fps, y un valor
# corto deja la vista vacía aunque el motor esté trabajando.
minesentinel.cuadro.expiracion-segundos=15.0

# El cuadro publicado es el único log de nivel DEBUG que explica por qué /camara
# está vacía. Se habilita sólo este servicio para no inundar la consola.
logging.level.com.sentinelmine.service.CuadroEppService=DEBUG

# ==============================================================================
#                 SEGURIDAD PARA DESPLIEGUE (variables de entorno)
# ==============================================================================
# Clave que el cliente Python envía en el header X-API-Key a /api/v1/**.
# Si está vacía y key-requerida=false, la API queda abierta. Definir
# MINESENTINEL_API_KEY (backend y cliente) la protege; API_KEY_REQUERIDA=true
# la cierra aunque falte la clave.
minesentinel.api.key=${MINESENTINEL_API_KEY:}
minesentinel.api.key-requerida=${API_KEY_REQUERIDA:false}
# Vacías = se crean con las contraseñas por defecto y no se tocan después.
minesentinel.admin.password=${ADMIN_PASSWORD:}
minesentinel.supervisor.password=${SUPERVISOR_PASSWORD:}
