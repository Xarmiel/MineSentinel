name: Pruebas MineSentinel (Java, Python y JavaScript)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-java:
    name: Pruebas Java (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MineSentinel-main
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: MineSentinel-main/pom.xml
      - name: Ejecutar pruebas con Maven
        run: mvn -B test

  test-python:
    name: Pruebas Python (python_client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MineSentinel-main/python_client
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y ejecutar pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pytest tests -q

  test-javascript:
    name: Pruebas JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MineSentinel-main
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Ejecutar pruebas JavaScript
        run: |
          node --test src/test/js/vision-navegador.test.mjs
          node src/test/js/prueba-camara.mjs

  test-browser:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MineSentinel-main
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: MineSentinel-main/pom.xml
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MineSentinel-main/package-lock.json
      - name: Instalar Playwright
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
