<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SentinelMine · Centro de Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav(${turno})}"></div>

<main class="content">
    <section class="camera-card">
    <video id="videoCamara" autoplay playsinline class="camera-feed" style="display:none;"></video>
    <div class="camera-placeholder" id="placeholderCamara">
        <span class="camera-icon">📷</span>
        <p>Activa la cámara para iniciar el monitoreo del punto de control.</p>
        <p class="small">El vídeo se procesa localmente en el navegador.</p>
        <button type="button" id="btnActivarCamara" class="btn-camara">Activar cámara</button>
    </div>
</section>

    <div>
        <section class="aforo-card">
            <div class="card-header">
                <h3>Control de Aforo</h3>
                <span id="badgeAforo" class="badge badge-success" th:text="${aforo.estado}">AFORO NORMAL</span>
            </div>
            <div class="aforo-numbers">
                <div><span id="aforoActual" class="num num-green" th:text="${aforo.actual}">42</span><small>AFORO ACTUAL</small></div>
                <div><span id="aforoMaximo" class="num" th:text="${aforo.maximo}">50</span><small>MÁX. PERMITIDO</small></div>
                <div><span id="aforoMinimo" class="num" th:text="${aforo.minimo}">10</span><small>MÍNIMO</small></div>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" th:style="'width:' + ${aforo.porcentaje} + '%'"></div>
            </div>
            <p id="progressLabel" class="progress-label" th:text="${aforo.porcentaje} + '% de capacidad'">84% de capacidad</p>
            <p class="ultimo-evento">Último cruce de línea virtual<br><span id="ultimoEvento" th:text="${aforo.ultimoEvento}"></span></p>
        </section>

        <section class="alertas-card">
            <div class="card-header">
                <h3>Alertas Recientes</h3>
                <span id="badgeAlertasConteo" class="badge" th:text="${#lists.size(alertas)} + ' eventos'">1 eventos</span>
            </div>
            <div id="contenedorAlertas">
                <div class="alerta" th:each="a : ${alertas}" th:classappend="${a.prioridadAlta} ? 'alerta-alta' : ''">
                    <div class="alerta-header">
                        <strong th:text="${a.tituloVisual}">Infracción de EPP detectada</strong>
                        <span class="hora" th:text="${a.horaFormateada}"></span>
                    </div>
                    <p th:text="${a.descripcion}"></p>
                    <div class="alerta-footer">
                        <span class="tag" th:text="'TRABAJADOR #' + ${a.trabajadorCodigo}"></span>
                        <span class="tag" th:classappend="${a.prioridadAlta} ? 'tag-alta' : 'tag-media'"
                              th:text="'Prioridad ' + ${a.prioridadTexto}"></span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<script>
    const btnActivarCamara = document.getElementById('btnActivarCamara');
    const videoCamara = document.getElementById('videoCamara');
    const placeholderCamara = document.getElementById('placeholderCamara');

    if (btnActivarCamara) {
        btnActivarCamara.addEventListener('click', async () => {
            if (videoCamara.srcObject) return; // ya está activa
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                videoCamara.srcObject = stream;
                videoCamara.style.display = 'block';
                placeholderCamara.style.display = 'none';
            } catch (err) {
                alert('No se pudo acceder a la cámara: ' + err.message);
            }
        });
    }

    async function refrescarDashboard() {
        try {
            const resAforo = await fetch('/api/v1/aforo/dashboard');
            if (resAforo.ok) {
                const data = await resAforo.json();
                const badge = document.getElementById('badgeAforo');
                if (badge) {
                    badge.textContent = data.estado || 'AFORO NORMAL';
                    badge.className = 'badge ' + (data.porcentaje >= 100 ? 'badge-alta' : (data.porcentaje >= 90 ? 'badge-media' : 'badge-success'));
                }
                const elActual = document.getElementById('aforoActual');
                if (elActual) elActual.textContent = data.actual;
                const elMax = document.getElementById('aforoMaximo');
                if (elMax) elMax.textContent = data.maximo;
                const elMin = document.getElementById('aforoMinimo');
                if (elMin) elMin.textContent = data.minimo;
                const elFill = document.getElementById('progressFill');
                if (elFill) elFill.style.width = data.porcentaje + '%';
                const elLabel = document.getElementById('progressLabel');
                if (elLabel) elLabel.textContent = data.porcentaje + '% de capacidad';
                const elUltimo = document.getElementById('ultimoEvento');
                if (elUltimo && data.ultimoEvento) elUltimo.textContent = data.ultimoEvento;
            }

            const resAlertas = await fetch('/api/v1/alertas/recientes?limit=3');
            if (resAlertas.ok) {
                const alertas = await resAlertas.json();
                const elConteo = document.getElementById('badgeAlertasConteo');
                if (elConteo) elConteo.textContent = alertas.length + ' eventos';
                const contenedor = document.getElementById('contenedorAlertas');
                if (contenedor && alertas.length > 0) {
                    contenedor.innerHTML = alertas.map(a => `
                        <div class="alerta ${a.prioridadAlta ? 'alerta-alta' : ''}">
                            <div class="alerta-header">
                                <strong>${a.tituloVisual || 'Alerta de Seguridad'}</strong>
                                <span class="hora">${a.horaFormateada || ''}</span>
                            </div>
                            <p>${a.descripcion || ''}</p>
                            <div class="alerta-footer">
                                <span class="tag">TRABAJADOR #${a.trabajadorCodigo || ''}</span>
                                <span class="tag ${a.prioridadAlta ? 'tag-alta' : 'tag-media'}">Prioridad ${a.prioridadTexto || 'Media'}</span>
                            </div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) {
            console.debug('Error en refresco asíncrono:', e);
        }
    }
    setInterval(refrescarDashboard, 3000);
</script>
</body>
</html>
